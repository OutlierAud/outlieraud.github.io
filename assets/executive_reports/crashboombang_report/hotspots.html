<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2024 Okinawa crash hotspots</title>

</head>
<body class="crash-map-page">

  <noscript>Enable JavaScript to explore the crash hotspots map.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>
    // Latitude, longitude and recorded crash count from the spatial analysis notebook.
    const hotspots = [
      [26.243, 127.692, 6.0],
      [26.286, 127.756, 6.0],
      [26.218, 127.681, 6.0],
      [26.218, 127.724, 5.0],

      [26.176, 127.668, 5.0],

      [26.608, 127.984, 4.0],
      [26.231, 127.686, 4.0],
      [26.293, 127.778, 4.0],

    const map = L.map("crash-map", { scrollWheelZoom: false }).setView([26.242, 127.723], 12);

</body>
</html>
