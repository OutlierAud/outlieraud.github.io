<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutlierAud | Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            font-size: 5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }

        .outlier {
            color: #1a1a1a;
        }

        .dot {
            color: #e63946;
            font-size: 5rem;
            margin: 0 0.1rem;
        }

        .aud {
            color: #1a1a1a;
        }

        .tagline {
            font-size: 1.5rem;
            color: #555;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
        }

        .message {
            font-size: 1rem;
            color: #af8ea2;
            line-height: 1.6;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }

        @media (max-width: 550px) {
            .logo { font-size: 3.2rem; }
            .dot { font-size: 3.2rem; }
            .tagline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="outlier">Outlier</span>
            <span class="dot">•</span>
            <span class="aud">Aud</span>
        </div>
        <div class="tagline">
            Healing The World With Pandas
        </div>
        <div class="message">
            🐼 Organized chaos coming soon!<br>
            Data science projects, 
            a few questionable experiments,<br>
            & visuals created at unreasonable hours.<br>
            
        </div>
    </div>
</body>
</html>
